name: Supabase Keep Alive

on:
  schedule:
    # Executa a cada 4 dias à meia-noite
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Permite a execução manual na aba Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pause
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Erro: As secrets SUPABASE_URL e SUPABASE_KEY não estão configuradas."
            exit 1
          fi
          
          echo "Fazendo requisição para $SUPABASE_URL..."
          
          # Fazemos um simples SELECT na tabela 'levels' para registrar atividade
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/levels?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Sucesso! Supabase pingado (Status: $RESPONSE)."
          else
            echo "Falha ao pingar Supabase. Status code: $RESPONSE"
            exit 1
          fi
